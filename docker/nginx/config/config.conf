server {
	listen       80;
	server_name  localhost;

	charset utf-8;
	access_log  /var/log/nginx/app.access.log main;

	underscores_in_headers on;

	location / {
        root   /build/front/dist;
        index  index.html;
		expires 60d;
		add_header Cache-Control "public, max-age=2592000, immutable";
		try_files $uri $uri/ /index.html;
    }


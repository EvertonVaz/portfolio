services:
  rabbitmq:
    image: rabbitmq:4-alpine
    restart: always
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_USER:-guest}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_PASS:-guest}
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ../..
      dockerfile: docker/production/backend.Dockerfile
    restart: always
    environment:
      - SECRET_KEY_BASE=${SECRET_KEY_BASE:?defina SECRET_KEY_BASE no ambiente}
      # Sem "/" no final: "amqp://host/" significa vhost vazio na spec AMQP, não o default
      - RABBITMQ_URL=amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASS:-guest}@rabbitmq
    healthcheck:
      # Porta 4000 aberta = Bandit no ar (sem curl/wget na imagem; bash nativo do debian-slim)
      test: ["CMD", "bash", "-c", "</dev/tcp/127.0.0.1/4000"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - default
      - sandbox

  # Minishell real numa jaula (docker/sandbox): sem segredos, sem saída para a internet,
  # sistema de arquivos somente leitura. Só o backend alcança a porta 7000.
  shell-sandbox:
    build:
      context: ../..
      dockerfile: docker/sandbox/Dockerfile
    restart: always
    read_only: true
    tmpfs:
      # único lugar gravável: o heredoc do minishell escreve em /tmp
      - /jail/tmp:size=1m,mode=1777,noexec,nosuid,nodev
    cap_drop:
      - ALL
    cap_add:
      # chroot + troca para o usuário sem privilégio, e o timeout matar a sessão depois dela
      - SYS_CHROOT
      - SETUID
      - SETGID
      - KILL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 256m
    cpus: 0.5
    networks:
      - sandbox

  ai:
    build:
      context: ../..
      dockerfile: docker/production/ai.Dockerfile
    restart: always
    environment:
      - RABBITMQ_URL=amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASS:-guest}@rabbitmq
    healthcheck:
      # Worker sem porta: valida a idade do heartbeat gravado pelo main.py (10s de intervalo)
      test: ["CMD", "python", "-c", "import os,sys,time; sys.exit(0 if time.time()-os.path.getmtime('/tmp/ai-heartbeat')<30 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    depends_on:
      rabbitmq:
        condition: service_healthy

  frontend:
    build:
      context: ../..
      dockerfile: docker/production/frontend.Dockerfile
      args:
        # Coolify injeta SOURCE_COMMIT no build; fora dele cai em "dev"
        SOURCE_COMMIT: ${SOURCE_COMMIT:-dev}
    restart: always
    expose:
      - "80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
    depends_on:
      backend:
        condition: service_healthy

networks:
  default:
  # internal: sem rota para fora; o sandbox só enxerga o backend
  sandbox:
    internal: true

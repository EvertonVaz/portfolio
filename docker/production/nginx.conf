server {
	listen       80;
	server_name  localhost;

	charset utf-8;
	access_log  /var/log/nginx/app.access.log main;

	underscores_in_headers on;

	# API de treino só existe em dev (make train-server); em produção
	# responde 503 direto — sem isso o try_files devolve o index.html com 200
	location ^~ /train-api {
        default_type application/json;
        return 503 '{"error":"training server unavailable"}';
    }

	# SPA shell: sempre revalidar, senão um deploy novo não chega em quem já visitou
	location / {
        root   /build/front/dist;
        index  index.html;
		add_header Cache-Control "no-cache";
		try_files $uri $uri/ /index.html;
    }

	# Bundles com hash no nome: imutáveis por definição, cache longo
	location ^~ /assets/ {
        root   /build/front/dist;
		expires 60d;
		add_header Cache-Control "public, max-age=2592000, immutable";
    }

    # Proxy para o WebSocket do Backend Elixir (BFF)
    location ^~ /ws/minishell {
        proxy_pass http://backend:4000/ws/minishell;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header Sec-WebSocket-Protocol $http_sec_websocket_protocol;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_cache_bypass $http_upgrade;
    }

    # Proxy para o WebSocket de Simulação (Philosophers)
    location ^~ /ws/philosophers {
        proxy_pass http://backend:4000/ws/philosophers;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header Sec-WebSocket-Protocol $http_sec_websocket_protocol;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_cache_bypass $http_upgrade;
    }

    # Proxy para o Socket Phoenix (Pong / Channels)
    location ^~ /socket {
        proxy_pass http://backend:4000/socket;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_cache_bypass $http_upgrade;
    }

    # Proxy para o Endpoint de Token do Backend Elixir (BFF)
    location ^~ /api/token {
        proxy_pass http://backend:4000/api/token;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /api/pong/room {
        proxy_pass http://backend:4000/api/pong/room;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

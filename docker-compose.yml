services:
  dev:
    restart: always
    build:
      context: ./docker/dev
      dockerfile: Dockerfile
    volumes:
      - ${HOME}/.p10k.zsh:/root/.p10k.zsh
      - ${HOME}/.zsh_history:/root/.zsh_history
      - ./:/src
      - ${HOME}/.gemini:/root/.gemini
    env_file:
      - ./envs/.env.production

  nginx:
    restart: always
    build:
      context: ./docker/nginx
      dockerfile: Dockerfile
    volumes:
      - ./app/frontend/dist:/build/front/dist
    ports:
      - "8888:80"
    env_file:
      - ./envs/.env.production
    depends_on:
      - backend

  backend:
    restart: always
    build:
      context: ./docker/backend
      dockerfile: Dockerfile
    volumes:
      - ./app/backend/elixir/_build/prod:/src
    develop:
      watch:
        - action: restart
          path: /src
    env_file:
      - ./envs/.env.production



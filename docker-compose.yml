services:
  rabbitmq:
    build:
      context: ./docker/rabbitmq
      dockerfile: Dockerfile
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  dev:
    restart: always
    user: etovaz
    build:
      context: ./docker/dev
      dockerfile: Dockerfile
      args:
        USER_NAME: etovaz
        USER_UID: ${UID:-1000}
        USER_GID: ${GID:-1000}
    volumes:
      - ${HOME}/.p10k.zsh:/home/etovaz/.p10k.zsh
      - ${HOME}/.zsh_history:/home/etovaz/.zsh_history
      - ./:/src
      - ${HOME}/.claude:/home/etovaz/.claude
      - ${HOME}/.claude.json:/home/etovaz/.claude.json
      - ${HOME}/.config/anthropic:/home/etovaz/.config/anthropic
    env_file:
      - ./envs/.env.production

  nginx:
    restart: always
    build:
      context: ./docker/nginx
      dockerfile: Dockerfile
    volumes:
      - ./app/frontend/dist:/build/front/dist
    ports:
      - "8888:80"
    env_file:
      - ./envs/.env.production
    depends_on:
      - backend

  backend:
    restart: always
    build:
      context: ./docker/backend
      dockerfile: Dockerfile
    volumes:
      - ./app/backend/elixir/_build/prod:/src
    develop:
      watch:
        - action: restart
          path: ./
    env_file:
      - ./envs/.env.production
      - ./envs/.env.pong
    environment:
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq/
    depends_on:
      rabbitmq:
        condition: service_healthy



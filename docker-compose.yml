services:
  rabbitmq:
    build:
      context: ./docker/rabbitmq
      dockerfile: Dockerfile
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  dev:
    restart: always
    user: etovaz
    build:
      context: ./docker/dev
      dockerfile: Dockerfile
      args:
        USER_NAME: etovaz
        USER_UID: ${UID:-1000}
        USER_GID: ${GID:-1000}
    volumes:
      - ${HOME}/.p10k.zsh:/home/etovaz/.p10k.zsh
      - ${HOME}/.zsh_history:/home/etovaz/.zsh_history
      - ./:/src
      - ${HOME}/.claude:/home/etovaz/.claude
      - ${HOME}/.claude.json:/home/etovaz/.claude.json
      - ${HOME}/.config/anthropic:/home/etovaz/.config/anthropic
      - ${HOME}/.config/gh:/home/etovaz/.config/gh
      - ${HOME}/.ssh:/home/etovaz/.ssh
    env_file:
      - ./envs/.env.production
    networks:
      - default
      - sandbox

  # Mesmo sandbox da produção (docker/production/docker-compose.yml); o `make back`
  # do container dev fala com ele em shell-sandbox:7000
  shell-sandbox:
    build:
      context: .
      dockerfile: docker/sandbox/Dockerfile
    restart: always
    read_only: true
    tmpfs:
      - /jail/tmp:size=1m,mode=1777,noexec,nosuid,nodev
    cap_drop:
      - ALL
    cap_add:
      - SYS_CHROOT
      - SETUID
      - SETGID
      - KILL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 256m
    cpus: 0.5
    networks:
      - sandbox

  nginx:
    restart: always
    build:
      context: ./docker/nginx
      dockerfile: Dockerfile
    volumes:
      - ./app/frontend/dist:/build/front/dist
    ports:
      - "8888:80"
    env_file:
      - ./envs/.env.production
    depends_on:
      - backend

  backend:
    restart: always
    build:
      context: ./docker/backend
      dockerfile: Dockerfile
    volumes:
      - ./app/backend/elixir/_build/prod:/src
    develop:
      watch:
        - action: restart
          path: ./
    env_file:
      - ./envs/.env.production
      - ./envs/.env.pong
    environment:
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq/
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - default
      - sandbox

networks:
  default:
  sandbox:
    internal: true

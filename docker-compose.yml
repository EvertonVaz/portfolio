services:
  dev:
    restart: always
    build:
      context: ./docker/dev
      dockerfile: Dockerfile
    volumes:
      - ${HOME}/.p10k.zsh:/root/.p10k.zsh
      - ${HOME}/.zsh_history:/root/.zsh_history
      - ./:/src
    env_file:
      - ./envs/.env.development

  nginx:
    restart: always
    build:
      context: ./docker/nginx
      dockerfile: Dockerfile
    volumes:
      - ./app/frontend/dist:/build/front/dist
    ports:
      - "8888:80"
    env_file:
      - ./envs/.env.production

  minishell:
    restart: always
    build:
      context: ./docker/minishell
      dockerfile: Dockerfile
    volumes:
      - ./app/minishell/dist:/src

  rabbitmq:
    restart: always
    build:
      context: ./docker/rabbitmq
      dockerfile: Dockerfile
    ports:
      - "15672:15672"


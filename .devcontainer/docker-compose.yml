# Ambiente de desenvolvimento — o mesmo para todos os devs do projeto.
#
# Mora aqui, e não no docker-compose.yml da raiz, porque a raiz é o compose do
# deploy: o compose interpola o arquivo inteiro antes de olhar profiles, e uma
# variável obrigatória de dev (${PROJECT_DIR:?}) derrubaria a produção.
#
# Sempre usado DEPOIS do compose da raiz (o devcontainer.json faz isso). Por
# isso os caminhos relativos resolvem a partir da raiz do repositório.
# Sem VS Code: make up-dev
services:
  dev:
    restart: always
    build:
      context: ./docker/dev
      dockerfile: Dockerfile
      args:
        USER_NAME: ${USER:?}
        USER_UID: ${DEV_UID:-1000}
        USER_GID: ${DEV_GID:-1000}
        PROJECT_DIR: ${PROJECT_DIR:?defina PROJECT_DIR no .env com o caminho do repo no host}
    depends_on:
      rabbitmq:
        condition: service_healthy
      # Sem healthcheck (jaula somente leitura): basta estar de pé para o `make back`
      shell-sandbox:
        condition: service_started
    env_file: .env
    # O `make back` do dev fala com shell-sandbox:7000, que só existe na rede sandbox
    networks:
      - default
      - sandbox
    # GID do grupo docker do host: `stat -c %g /var/run/docker.sock`
    group_add:
      - "${DOCKER_GID:-984}"
    volumes:
      # Mesmo caminho do host: docker pelo socket é o daemon do host, e bind
      # mount disparado daqui de dentro resolve o caminho lá fora.
      - ./:${PROJECT_DIR:?}
      - /var/run/docker.sock:/var/run/docker.sock
      - ${HOME}/.p10k.zsh:/home/${USER}/.p10k.zsh
      - ${HOME}/.zsh_history:/home/${USER}/.zsh_history
      - ${HOME}/.claude:/home/${USER}/.claude
      - ${HOME}/.claude.json:/home/${USER}/.claude.json
      - ${HOME}/.config/anthropic:/home/${USER}/.config/anthropic
      - ${HOME}/.config/gh:/home/${USER}/.config/gh
      - ${HOME}/.local/share/mise/shims/ai-memory:/home/${USER}/.local/share/mise/shims/ai-memory
      - ${HOME}/.zshenv:/home/${USER}/.zshenv
      - ${HOME}/.tmux:/home/${USER}/.tmux
      - ${HOME}/.tmux.conf:/home/${USER}/.tmux.conf
